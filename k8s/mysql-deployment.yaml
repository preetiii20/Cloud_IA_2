apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: finsmart-mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsmart-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finsmart-mysql
  template:
    metadata:
      labels:
        app: finsmart-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "root"
            - name: MYSQL_DATABASE
              value: "finsmart"
            - name: MYSQL_USER
              value: "finsmart_app"
            - name: MYSQL_PASSWORD
              value: "YourStrongAppPassword"
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: finsmart-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: finsmart-mysql
spec:
  selector:
    app: finsmart-mysql
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP